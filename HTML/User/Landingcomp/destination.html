<section class="destination-section" id="top-destinations">
  <div class="destination-container">

    <!-- Section Header -->
    <div class="destination-header">
      <div class="destination-title-group">
        <span class="destination-badge">Our Destination</span>
        <h2 class="destination-heading">Your Journey to the Perfect<br>Destination Begins Here</h2>
      </div>
      <a href="#flights" class="see-all-btn">
        <span>See All Destinations</span>
        <span class="btn-arrow-circle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </span>
      </a>
    </div>

    <!-- Destination Cards Track Wrapper -->
    <div class="destination-slider-wrapper">
      <div class="destination-grid" id="destinationGrid">

        <!-- Card 1 -->
        <div class="destination-card">
          <img src="../../images/destination_sahara.jpg" alt="Sahara Dawn" class="card-bg-img">
          <div class="card-arrow-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
          <div class="card-content-overlay">
            <h3 class="card-title">Sahara Dawn</h3>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="destination-card">
          <img src="../../images/destination_oasis.jpg" alt="Oasis Mirage" class="card-bg-img">
          <div class="card-arrow-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
          <div class="card-content-overlay">
            <h3 class="card-title">Oasis Mirage</h3>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="destination-card">
          <img src="../../images/destination_crimson.jpg" alt="Crimson Dunes" class="card-bg-img">
          <div class="card-arrow-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
          <div class="card-content-overlay">
            <h3 class="card-title">Crimson Dunes</h3>
          </div>
        </div>

        <!-- Card 4 -->
        <div class="destination-card">
          <img src="../../images/destination_alpine.jpg" alt="Alpine Haven" class="card-bg-img">
          <div class="card-arrow-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
          <div class="card-content-overlay">
            <h3 class="card-title">Alpine Haven</h3>
          </div>
        </div>

        <!-- Card 5 -->
        <div class="destination-card">
          <img src="../../images/destination_azure.jpg" alt="Azure Atoll" class="card-bg-img">
          <div class="card-arrow-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
          <div class="card-content-overlay">
            <h3 class="card-title">Azure Atoll</h3>
          </div>
        </div>

        <!-- Card 6 -->
        <div class="destination-card">
          <img src="../../images/destination_canyon.jpg" alt="Golden Canyon" class="card-bg-img">
          <div class="card-arrow-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
          <div class="card-content-overlay">
            <h3 class="card-title">Golden Canyon</h3>
          </div>
        </div>

      </div>
    </div>

    <!-- Carousel Arrows Under Cards -->
    <div class="destination-pagination">
      <button type="button" class="page-btn prev-btn" id="destPrevBtn" aria-label="Previous destinations" title="Previous 3 Destinations">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button type="button" class="page-btn next-btn" id="destNextBtn" aria-label="Next destinations" title="Next 3 Destinations">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

  </div>
</section>
