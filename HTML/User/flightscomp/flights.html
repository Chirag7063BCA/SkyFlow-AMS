<section class="flights-section" id="flights">
  <div class="flights-search-bar">
    <div class="fsb-container">
      <!-- Top Fields Row -->
      <div class="fsb-cards-row">
        <!-- Trip Type -->
        <div class="fsb-card">
          <div class="fsb-card-label">
            <span>TRIP TYPE</span>
            <span class="fsb-chevron">▼</span>
          </div>
          <select class="fsb-card-select" id="fsbTripType">
            <option value="roundTrip" selected>Round Trip</option>
            <option value="oneWay">One Way</option>
            <option value="multiCity">Multi City</option>
          </select>
        </div>

        <!-- From -->
        <div class="fsb-card flight-field" style="position: relative;">
          <label for="fsbFrom" class="fsb-card-label">FROM</label>
          <input type="search" id="fsbFrom" class="fsb-card-input" value="" placeholder="City or airport" autocomplete="off">
          <div id="fsbFromDropdown" class="autocomplete-dropdown"></div>
        </div>

        <!-- Swap Button -->
        <button class="fsb-swap-btn" id="fsbSwap" type="button" aria-label="Swap">⇄</button>

        <!-- To -->
        <div class="fsb-card flight-field" style="position: relative;">
          <label for="fsbTo" class="fsb-card-label">TO</label>
          <input type="search" id="fsbTo" class="fsb-card-input" value="" placeholder="City or airport" autocomplete="off">
          <div id="fsbToDropdown" class="autocomplete-dropdown"></div>
        </div>

        <!-- Depart -->
        <div class="fsb-card flight-field" style="position: relative;">
          <label for="fsbDepart" class="fsb-card-label">DEPART</label>
          <input type="text" id="fsbDepart" class="fsb-card-input" value="Thu, 6 Aug 26" readonly style="cursor: pointer;">
          <div id="fsbDepartDropdown" class="autocomplete-dropdown calendar-dropdown"></div>
        </div>

        <!-- Return -->
        <div class="fsb-card flight-field" style="position: relative;">
          <div class="fsb-card-header">
            <label for="fsbReturn" class="fsb-card-label">RETURN</label>
            <button type="button" class="fsb-card-clear" id="fsbReturnClear" aria-label="Clear return">✕</button>
          </div>
          <input type="text" id="fsbReturn" class="fsb-card-input" value="Fri, 7 Aug 26" readonly style="cursor: pointer;">
          <div id="fsbReturnDropdown" class="autocomplete-dropdown calendar-dropdown"></div>
        </div>

        <!-- Travellers -->
        <div class="fsb-card flight-field" style="position: relative;">
          <label for="fsbTravellers" class="fsb-card-label">TRAVELLERS</label>
          <input type="text" id="fsbTravellers" class="fsb-card-input" value="1 Adult" readonly style="cursor: pointer;">
          <div id="fsbTravellersDropdown" class="autocomplete-dropdown travellers-dropdown"></div>
        </div>

        <!-- Cabin Class -->
        <div class="fsb-card">
          <label for="fsbCabin" class="fsb-card-label">CABIN CLASS</label>
          <input type="text" id="fsbCabin" class="fsb-card-input" value="Economy/ P...">
        </div>

        <!-- Search Button -->
        <button class="fsb-search-btn" id="fsbSearchBtn" type="button">SEARCH</button>
      </div>

      <!-- Bottom Fare Type Options -->
      <div class="fsb-fare-row">
        <span class="fsb-fare-title">FARE TYPE:</span>
        <div class="fsb-fare-options">
          <label class="fsb-fare-pill">
            <input type="radio" name="fsbFareType" value="regular" checked>
            <span>Regular</span>
          </label>

          <label class="fsb-fare-pill">
            <input type="radio" name="fsbFareType" value="student">
            <span>Student</span>
          </label>

          <label class="fsb-fare-pill">
            <input type="radio" name="fsbFareType" value="armed">
            <span>Armed Forces</span>
          </label>

          <label class="fsb-fare-pill">
            <input type="radio" name="fsbFareType" value="gst">
            <span>Have a GST number ?</span>
            <span class="fsb-badge-new">new</span>
          </label>

          <label class="fsb-fare-pill">
            <input type="radio" name="fsbFareType" value="senior">
            <span>Senior Citizen</span>
          </label>

          <label class="fsb-fare-pill">
            <input type="radio" name="fsbFareType" value="doctor">
            <span>Doctor and Nurses</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="flights-header">
    <h2 class="flights-title" id="flightsTitle">
      AVAILABLE <span class="flights-title-accent">FLIGHTS</span>
    </h2>
    <p class="flights-note" id="flightsNote">
      <span class="animated-note-wrapper">
        <span class="animated-note">All available flights are shown below.</span>
        <span class="animated-note delay">Discover top deals on domestic & international routes.</span>
      </span>
    </p>
  </div>

  <div class="flights-layout">
    <!-- Left Side: Flights Grid -->
    <div class="flights-main">
      <div class="flights-grid" id="flightsGrid"></div>
    </div>

    <!-- Right Side: Filters Sidebar -->
    <aside class="flights-sidebar">
      <div class="filter-card">
        <h3 class="filter-title">Filters</h3>

        <!-- Price Range Filter -->
        <div class="filter-group">
          <label class="filter-label">Max Price: <span id="priceValue">$2000</span></label>
          <input type="range" id="priceRange" class="filter-range" min="100" max="5000" step="50" value="5000">
        </div>

        <!-- Stops Filter -->
        <div class="filter-group">
          <label class="filter-label">Stops</label>
          <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" class="stop-filter" value="0"> Non-Stop</label>
            <label class="checkbox-label"><input type="checkbox" class="stop-filter" value="1"> 1 Stop</label>
            <label class="checkbox-label"><input type="checkbox" class="stop-filter" value="2"> 2+ Stops</label>
          </div>
        </div>

        <!-- Airlines Filter -->
        <div class="filter-group">
          <label class="filter-label">Airlines</label>
          <div class="checkbox-group" id="airlineFilters">
            <!-- Airlines will be populated dynamically by JS -->
          </div>
        </div>
      </div>
    </aside>
  </div>
</section>
