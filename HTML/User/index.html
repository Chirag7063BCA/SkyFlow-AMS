<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyFlow – Airline Management System</title>

  <!-- Global & Component Stylesheets -->
  <link rel="stylesheet" href="../../CSS/User/style.css">
  <link rel="stylesheet" href="../../CSS/globalcomp/navbar.css">
  <link rel="stylesheet" href="../../CSS/Landingcomp/hero.css">
  <link rel="stylesheet" href="../../CSS/flightscomp/flights.css">
  <link rel="stylesheet" href="../../CSS/globalcomp/footer.css">
  <link rel="stylesheet" href="../../CSS/User/signup.css">
  <script src="../../Javascript/User/auth.js"></script>
</head>

<body>
  <!-- Dynamic Component Containers -->
  <div id="navbar-container"></div>
  <main id="app-content"></main>
  <div id="footer-container"></div>

  <!-- Right-Side Popup Auth Drawer (Sign In & Sign Up) -->
  <div id="signupDrawer" class="signup-drawer">
    <!-- Dark Backdrop Overlay -->
    <div id="drawerOverlay" class="drawer-overlay"></div>

    <!-- Right Sliding Form Panel -->
    <div class="drawer-panel">
      <!-- Drawer Header with Brand & Close Button -->
      <div class="drawer-header">
        <div class="drawer-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M3 15.5L11.5 3l-1.8 8.2L21 9.5 8.5 21l2.3-8.5L3 15.5Z" fill="#2563eb" />
          </svg>
          <h2 id="drawerTitle">Welcome Back</h2>
        </div>
        <button type="button" id="closeDrawerBtn" class="close-btn">&times;</button>
      </div>

      <!-- Segmented Tab Slider (Sign In / Sign Up) -->
      <div class="auth-tabs">
        <button type="button" id="signinTab" class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
        <button type="button" id="signupTab" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Sign In Form -->
      <form id="signinForm" class="auth-form">
        <div class="form-group">
          <label for="signinEmail">Email Address</label>
          <input type="email" id="signinEmail" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="signinPassword">Password</label>
          <input type="password" id="signinPassword" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" onclick="alert('Password reset link sent to your email!'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signupForm" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
      </form>

      <!-- OR Divider -->
      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Google OAuth Button -->
      <button type="button" class="google-btn" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Toggle Switch Footer -->
      <p id="authSwitchFooter" class="footer-text">
        Don't have an account? <a href="#" onclick="switchTab('signup'); return false;">Create account</a>
      </p>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    async function loadComponent(url, containerId) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Failed to load ${url}`);
        const html = await response.text();
        document.getElementById(containerId).innerHTML = html;
      } catch (error) {
        console.error('Error loading component:', error);
      }
    }

    function patchNavLinks() {
      document.querySelectorAll('.nav-link[data-route]').forEach(link => {
        const route = link.dataset.route;
        if (route === 'home') link.href = 'index.html';
        if (route === 'flights') link.href = 'index.html#flights';
        if (route === 'track') link.href = 'Track%20Flight/trackFlight.html';
        if (route === 'bookings') link.href = 'mybookings/bookings.html';
      });
    }

    function activateNav(route) {
      const activeLink = document.querySelector(`.nav-link[data-route="${route}"]`);
      if (activeLink) activeLink.classList.add('active');
    }

    async function initApp() {
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      // Load global components
      await loadComponent('globalcomp/navbar.html', 'navbar-container');
      patchNavLinks();
      activateNav('home');
      await loadComponent('globalcomp/footer.html', 'footer-container');

      // Load main page contents (hero and flights sections)
      try {
        const heroResponse = await fetch('Landingcomp/hero.html');
        if (!heroResponse.ok) throw new Error('Failed to load hero section');
        const heroHtml = await heroResponse.text();

        const flightsResponse = await fetch('flightscomp/flights.html');
        if (!flightsResponse.ok) throw new Error('Failed to load flights section');
        const flightsHtml = await flightsResponse.text();

        document.getElementById('app-content').innerHTML = `
          <div id="hero-view">${heroHtml}</div>
          <div id="flights-view" style="display: none;">${flightsHtml}</div>
        `;

        // Load flights script to wire up search filters and render flights
        const script = document.createElement('script');
        script.src = '../../Javascript/User/flights.js';
        document.body.appendChild(script);
      } catch (error) {
        console.error('Error loading main page content:', error);
      }
    }

    // Initialize when DOM is ready
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>

</html>
