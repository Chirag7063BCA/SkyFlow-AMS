<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Flight – SkyFlow</title>

  <!-- Global & Page Stylesheets -->
  <link rel="stylesheet" href="../../../CSS/User/style.css">
  <link rel="stylesheet" href="../../../CSS/globalcomp/navbar.css">
  <link rel="stylesheet" href="../../../CSS/Landingcomp/hero.css">
  <link rel="stylesheet" href="../../../CSS/globalcomp/footer.css">
  <link rel="stylesheet" href="../../../CSS/User/signup.css">
  <link rel="stylesheet" href="../../../CSS/User/trackFlight.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <!-- Global Navbar -->
  <div id="navbar-container"></div>

  <main id="app-content">
    <section class="hero-section track-hero" style="min-height: 85vh; padding-top: 130px; padding-bottom: 60px;">
      <div class="hero-content" style="max-width: 1100px; margin: 0 auto; padding: 0 1.5rem;">
        
        <p class="hero-eyebrow">Real-Time Flight Tracker</p>
        <h1 class="hero-title" style="margin-bottom: 1.5rem; justify-content: center; text-align: center; color: white;">
          TRACK YOUR
          <span class="animated-text-wrapper" style="margin: 0 10px;">
            <span class="animated-text hero-title-accent">FLIGHT</span>
            <span class="animated-text hero-title-accent delay">JOURNEY</span>
          </span>
        </h1>
        <p class="hero-copy" style="text-align: center; max-width: 600px; margin: 0 auto 2.5rem auto; color: rgba(255,255,255,0.9);">
          Stay informed with live departure, arrival, terminal, and status updates for flights worldwide.
        </p>

        <!-- Flight Search Box -->
        <div class="search-card" style="margin-bottom: 2rem;">
          <div class="fields-wrapper">
            <div class="fields-row" style="grid-template-columns: 2fr 1fr; gap: 1rem;">
              <div class="flight-field">
                <label class="field-label" for="trackSearchInput">Flight Number or City</label>
                <input id="trackSearchInput" type="search" class="field-control" placeholder="e.g. EM10000, London, Tokyo, United Airlines" autocomplete="off">
              </div>

              <div class="flight-field">
                <label class="field-label" for="statusFilter">Flight Status</label>
                <select id="statusFilter" class="field-control">
                  <option value="ALL">All Statuses</option>
                  <option value="On Time">On Time</option>
                  <option value="Scheduled">Scheduled</option>
                  <option value="In Flight">In Flight</option>
                  <option value="Delayed">Delayed</option>
                </select>
              </div>
            </div>
          </div>

          <div style="display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between;">
            <div class="feature-grid" style="margin-top: 0; width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem;">
              <div class="feature-card" style="padding: 0.75rem 1rem;">
                <span style="font-size: 1.25rem;">📡</span> Live Radar Updates
              </div>
              <div class="feature-card" style="padding: 0.75rem 1rem;">
                <span style="font-size: 1.25rem;">⏱</span> Accurate Departure Times
              </div>
              <div class="feature-card" style="padding: 0.75rem 1rem;">
                <span style="font-size: 1.25rem;">🏢</span> Gate & Terminal Details
              </div>
            </div>
          </div>
        </div>

        <!-- Track Results Section -->
        <div id="trackResultsContainer" style="margin-top: 2rem;">
          <div id="trackResultsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem;">
            <!-- Dynamic Flight Status Cards populated by JS -->
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- Global Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="../../../Javascript/User/auth.js"></script>
  <script>
    const loadComp = async (url, id) => {
      try {
        const res = await fetch(url);
        if (res.ok) document.getElementById(id).innerHTML = await res.text();
      } catch (e) { console.error('Error loading component:', e); }
    };

    let allTrackFlights = [];

    async function initTrackPage() {
      await loadComp('../globalcomp/navbar.html', 'navbar-container');
      await loadComp('../globalcomp/footer.html', 'footer-container');

      if (typeof initSkyFlowPage === 'function') {
        initSkyFlowPage('track');
      }

      try {
        const res = await fetch('../../../Data/flights.json');
        if (res.ok) {
          allTrackFlights = await res.json();
          renderTrackFlights();
        }
      } catch (e) { console.error('Error fetching flight data:', e); }

      document.getElementById('trackSearchInput')?.addEventListener('input', renderTrackFlights);
      document.getElementById('statusFilter')?.addEventListener('change', renderTrackFlights);
    }

    function renderTrackFlights() {
      const grid = document.getElementById('trackResultsGrid');
      if (!grid) return;

      const query = (document.getElementById('trackSearchInput')?.value || '').toLowerCase().trim();
      const selectedStatus = document.getElementById('statusFilter')?.value || 'ALL';

      const filtered = allTrackFlights.filter(f => {
        const txt = `${f.flightNumber} ${f.airline} ${f.originCity} ${f.destinationCity} ${f.fromAirportCode} ${f.toAirportCode} ${f.status}`.toLowerCase();
        const matchesQuery = !query || txt.includes(query);
        const matchesStatus = selectedStatus === 'ALL' || f.status.toLowerCase() === selectedStatus.toLowerCase();
        return matchesQuery && matchesStatus;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem 1.5rem; background: rgba(255,255,255,0.95); border-radius: 16px; border: 1px solid rgba(0,0,0,0.06); color: #1e293b;">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">✈️</div>
            <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 0.25rem;">No Tracked Flights Found</h3>
            <p style="color: #64748b; font-size: 0.9rem;">Try adjusting your flight number, city, or status filter.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.slice(0, 18).map(f => {
        const isCompleted = f.status === 'Completed' || f.status === 'Landed';
        const isDelayed = f.status === 'Delayed';
        const statusBg = isDelayed ? '#ef4444' : (isCompleted ? '#10b981' : '#2563eb');

        return `
          <div style="background: rgba(255,255,255,0.98); border-radius: 16px; padding: 1.25rem; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 4px 16px rgba(0,0,0,0.05); text-align: left; color: #1e293b;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
              <span style="font-size: 0.85rem; font-weight: 700; color: #3b82f6;">${f.airline} · ${f.flightNumber}</span>
              <span style="background: ${statusBg}; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;">${f.status}</span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
              <div>
                <h4 style="font-size: 1.2rem; font-weight: 800; margin: 0; color: #0f172a;">${f.fromAirportCode}</h4>
                <p style="font-size: 0.8rem; color: #64748b; margin: 0;">${f.originCity}</p>
                <span style="font-size: 0.85rem; font-weight: 700; color: #334155;">${f.departureTime}</span>
              </div>

              <div style="text-align: center; padding: 0 0.5rem;">
                <span style="font-size: 0.75rem; color: #64748b; font-weight: 600;">${f.duration}</span>
                <div style="width: 60px; height: 2px; background: #cbd5e1; margin: 4px auto; position: relative;">
                  <span style="position: absolute; top: -7px; left: 22px; font-size: 0.75rem;">✈</span>
                </div>
                <span style="font-size: 0.7rem; color: #94a3b8;">${f.nonStop ? 'Non-stop' : '1 stop'}</span>
              </div>

              <div style="text-align: right;">
                <h4 style="font-size: 1.2rem; font-weight: 800; margin: 0; color: #0f172a;">${f.toAirportCode}</h4>
                <p style="font-size: 0.8rem; color: #64748b; margin: 0;">${f.destinationCity}</p>
                <span style="font-size: 0.85rem; font-weight: 700; color: #334155;">${f.arrivalTime}</span>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; border-top: 1px dashed #e2e8f0; padding-top: 0.75rem; font-size: 0.8rem; color: #64748b;">
              <span>Gate: <b style="color: #1e293b;">T2 - Gate ${Math.floor(Math.random() * 15) + 1}</b></span>
              <span>Fare: <b style="color: #2563eb;">${f.fare}</b></span>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', initTrackPage);
  </script>
</body>

</html>
