<!-- Floating AI Support Circle Button (Right Side) -->
<button type="button" class="ai-widget-trigger" id="aiWidgetTrigger" aria-label="Toggle AI Navigator Support" title="Open AI Support">
  <div class="trigger-glow"></div>
  <div class="trigger-bot-avatar">
    <div class="trigger-bot-ring"></div>
    <div class="trigger-bot-face">
      <span class="trigger-eye left"></span>
      <span class="trigger-eye right"></span>
    </div>
  </div>
  <span class="trigger-online-dot"></span>
  <span class="trigger-label">AI Support</span>
</button>

<!-- AI Floating Chat Box Popup Window -->
<div class="ai-chat-popup-window" id="aiChatWidget" aria-hidden="true">
  <div class="ai-popup-chat-container">
    
    <!-- Chat Header Bar -->
    <header class="chat-header-bar">
      <div class="header-bot-info">
        <div class="bot-mini-avatar">
          <div class="mini-bot-face">
            <span class="mini-eye"></span>
            <span class="mini-eye"></span>
          </div>
        </div>
        <div>
          <h2 class="chat-header-title">Navigator AI <span class="badge-active">Online</span></h2>
          <span class="chat-header-sub">SkyFlow Copilot 4.0</span>
        </div>
      </div>
      <div class="chat-header-actions">
        <button type="button" id="toggleTopicsBtn" class="icon-action-btn" title="Quick Topics">💡</button>
        <button type="button" id="headerClearBtn" class="icon-action-btn" title="Clear Chat">🗑️</button>
        <button type="button" id="closeChatBtn" class="icon-action-btn close-btn" title="Close Chat">✕</button>
      </div>
    </header>

    <!-- Popular Topics Drawer (Toggleable) -->
    <div class="popup-topics-drawer" id="popupTopicsDrawer" style="display: none;">
      <div class="topic-chips-grid">
        <button type="button" class="topic-chip-btn" data-topic="Book a Flight ✈️">✈️ Book Flight</button>
        <button type="button" class="topic-chip-btn" data-topic="Track Flight Radar 🔍">🔍 Radar</button>
        <button type="button" class="topic-chip-btn" data-topic="Baggage Policy 🧳">🧳 Baggage</button>
        <button type="button" class="topic-chip-btn" data-topic="My Bookings & Refunds 🎫">🎫 Refunds</button>
        <button type="button" class="topic-chip-btn" data-topic="Flight Delays & Gate Alerts 🕒">🕒 Gate Alerts</button>
        <button type="button" class="topic-chip-btn" data-topic="Contact Support Desk 📞">📞 Support Desk</button>
      </div>
    </div>

    <!-- Chat Main Workspace -->
    <main class="ai-workspace-wrapper">
      <section class="ai-chat-area">
        
        <!-- Message Feed -->
        <div class="chat-messages" id="chatMessages">
          <div class="message-row bot-row">
            <div class="bot-mini-avatar">
              <div class="mini-bot-face">
                <span class="mini-eye"></span>
                <span class="mini-eye"></span>
              </div>
            </div>
            <div class="message-bubble bot-bubble">Hey there! 👋 I'm Navigator, your SkyFlow AI flight copilot. How can I assist your journey today?</div>
          </div>
        </div>

        <!-- Quick Reply Chips -->
        <div class="quick-replies-wrapper" id="quickReplies">
          <button class="quick-chip" data-msg="Help me book a flight">Book Flight ✈️</button>
          <button class="quick-chip" data-msg="How do I track my flight?">Track 🔍</button>
          <button class="quick-chip" data-msg="What are the baggage rules?">Baggage 🧳</button>
          <button class="quick-chip" data-msg="Contact Support Desk">Support 📞</button>
        </div>

        <!-- Input Bar -->
        <div class="chat-input-area">
          <div class="pill-input-box">
            <input type="text" id="chatInput" placeholder="Ask Navigator AI..." aria-label="Type your message" autocomplete="off">
            <button type="button" id="sendBtn" class="send-btn" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </div>

      </section>
    </main>

  </div>
</div>
