<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Report - SkyFlow Admin</title>
  <link rel="stylesheet" href="../../CSS/Admin/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">SF</div>
        <div>
          <h1>SkyFlow</h1>
          <p>Admin Console</p>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" href="index.html"><span>◉</span><span>Dashboard</span></a>
        <a class="nav-item" href="flights.html"><span>✈</span><span>Flights</span></a>
        <a class="nav-item" href="bookings.html"><span>◫</span><span>Bookings</span></a>
        <a class="nav-item" href="passengers.html"><span>◌</span><span>Passengers</span></a>
        <a class="nav-item" href="settings.html"><span>⚙</span><span>Settings</span></a>
      </nav>
      <div class="sidebar-card">
        <h3>Today’s Focus</h3>
        <p>Monitor 18 departures, 12 arrivals, and 4 priority alerts.</p>
        <button type="button" onclick="location.href='flight-board.html'">View Flight Board</button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <p class="eyebrow">Data Extract</p>
          <h2>Export System Report</h2>
        </div>
      </header>

      <section class="panel" style="max-width: 600px;">
        <div class="panel-header">
          <h3>Report Parameters</h3>
        </div>
        <form>
          <div class="form-group">
            <label>Report Type</label>
            <select class="form-control">
              <option>Revenue & Bookings Ledger</option>
              <option>Flight Performance & On-Time</option>
              <option>Passenger Manifests</option>
              <option>Operations & Alert Logs</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Start Date</label>
              <input type="date" class="form-control">
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input type="date" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label>Export Format</label>
            <div style="display:flex; gap: 24px; align-items:center; margin-top:12px;">
              <label class="custom-radio"><input type="radio" name="format" checked> CSV Spreadsheet</label>
              <label class="custom-radio"><input type="radio" name="format"> PDF Document</label>
              <label class="custom-radio"><input type="radio" name="format"> JSON Data</label>
            </div>
          </div>
          
          <div style="margin-top: 32px; display:flex; gap:12px;">
            <button type="button" class="primary-btn" onclick="alert('Report generating...'); location.href='index.html'">Generate & Download</button>
            <button type="button" class="ghost-btn" style="color:var(--text-main); border:1px solid var(--border);" onclick="location.href='index.html'">Cancel</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
